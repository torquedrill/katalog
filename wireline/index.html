<!doctype html><html lang="tr"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Torque Drill Parça Kataloğu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
/* Layout: group/assembly navigator on top; drawing sheet left, parts list right; stacks on phone. Sheet stays paper-white in both themes. */
:root{
  --bg:#eef0f2; --panel:#ffffff; --fg:#1b1f24; --muted:#5d6670; --line:#d5d9de;
  --accent:#d98a00; --accent-ink:#8a5600; --accent-soft:#fff2d6;
  --bl:#1f5fbf; --bl-soft:#e6efff; --danger:#c0392b;
  --paper:#ffffff;
  --f-body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15181c; --panel:#1d2126; --fg:#e7eaee; --muted:#9aa3ad; --line:#2f353c;
  --accent:#f0a420; --accent-ink:#ffc967; --accent-soft:#3a2c10;
  --bl:#7fb0ff; --bl-soft:#1b2a44; --danger:#ff7b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15181c; --panel:#1d2126; --fg:#e7eaee; --muted:#9aa3ad; --line:#2f353c;
  --accent:#f0a420; --accent-ink:#ffc967; --accent-soft:#3a2c10;
  --bl:#7fb0ff; --bl-soft:#1b2a44; --danger:#ff7b6b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp-l{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{font:inherit;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-current="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.chip .cnt{font-family:var(--f-mono);font-size:11px;color:var(--accent-ink);margin-left:5px}
.chip[aria-current="true"] .cnt{color:var(--accent)}
header h1{margin:0;font-size:clamp(20px,2.4vw,28px);font-weight:700;letter-spacing:.01em;text-wrap:balance}
header .sub{color:var(--muted);font-size:13px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 12px}
header .sub .asmcode{font-family:var(--f-mono);font-weight:600;color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:13px;font-weight:600;letter-spacing:.03em;border:0;background:transparent;color:var(--muted);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--panel)}
button:focus-visible,tr:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);width:220px;max-width:100%}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warn{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:8px 10px}
.editbar .msg{font-size:13px;color:var(--accent-ink);flex:1 1 240px;min-width:0}
.meta{font-size:12px;color:var(--muted)}
.setwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.setwrap summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:14px}
.settings{padding:0 12px 12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.settings label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.settings input,.settings select{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);min-width:0}
.settings .views-ed{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.vrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vrow input{flex:1 1 140px}
.vrow .tag{font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.settings .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}
@media (max-width:960px){.sheet{position:static}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);min-height:47px}
.zoom{display:flex;gap:4px;margin-left:auto}
.zoom button{font:inherit;font-weight:600;width:32px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);cursor:pointer}
.zoom .zl{font-family:var(--f-mono);font-size:12px;color:var(--muted);align-self:center;min-width:42px;text-align:center}
.vp{overflow:auto;background:var(--paper);max-height:78vh}
.canvas{position:relative;width:100%}
.canvas img{display:block;width:100%;height:auto;max-width:none;user-select:none;-webkit-user-drag:none}
.canvas svg{position:absolute;inset:0;width:100%;height:100%}
.noview{padding:48px 16px;text-align:center;color:#5d6670;font-size:14px}
.bal circle.c{fill:#fff;stroke:#111}
.bal text{font-family:var(--f-body);font-weight:700;fill:#111;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bal line{stroke:#111}
.bal .dot{fill:#111}
.bal{cursor:pointer}
.bal:hover circle.c{fill:#fff2d6}
.bal.on circle.c{fill:#d98a00;stroke:#8a5600}
.bal.on text{fill:#fff}
.bal.on line{stroke:#d98a00}
.bal.on .dot{fill:#d98a00}
.editing .bal .dot{fill:#1f5fbf;cursor:grab}
.editing .bal circle.c{cursor:grab}
.bal.inst circle.c{stroke:#1f5fbf}
.ring{fill:none;stroke:#d98a00;opacity:.9}
.hot{fill:transparent;stroke:transparent;cursor:pointer}
.hot:hover{fill:rgba(217,138,0,.18)}
.hot.on{fill:rgba(217,138,0,.28);stroke:#d98a00}
.editing .hot{stroke:rgba(31,95,191,.65);stroke-dasharray:5 4;cursor:grab}
.editing .hot.inst{stroke:#1f5fbf;stroke-dasharray:none}
.placing .canvas{cursor:copy}
@media (prefers-reduced-motion:no-preference){.ring{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
 @keyframes pulse{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.35);opacity:0}}}
.detail{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);min-height:48px;font-size:14px}
.detail .no{font-weight:700;background:var(--accent);color:#fff;border-radius:999px;min-width:28px;height:28px;display:inline-grid;place-items:center;padding:0 7px}
.detail .code{font-family:var(--f-mono);font-weight:600}
.detail .hint{color:var(--muted)}
.detail select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.copy,.open{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:3px 8px;cursor:pointer}
.open{border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.list .scroll{max-height:calc(78vh + 48px);overflow:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead th{position:sticky;top:0;background:var(--panel);z-index:1;text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
tbody tr.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
td.n{font-weight:700;text-align:center;width:38px}
td.code{font-family:var(--f-mono);font-size:12.5px;font-weight:600;white-space:nowrap}
td.q{text-align:right;width:44px}
.src{font-size:11px;font-weight:600;letter-spacing:.05em;border-radius:4px;padding:1px 5px;border:1px solid var(--line);color:var(--muted)}
.src.bl{color:var(--bl);background:var(--bl-soft);border-color:transparent}
.views{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.vchip{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.vchip.link{color:var(--accent-ink);border-color:var(--accent)}
.nm{line-height:1.25}
td input,td select{font:inherit;font-size:13px;width:100%;min-width:0;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--fg)}
td input.code-in{font-family:var(--f-mono);font-size:12px}
td input.num{width:56px;text-align:right}
td input.no-in{width:48px;text-align:center}
.rowdel{border:0;background:transparent;color:var(--danger);font-size:17px;cursor:pointer;padding:2px 4px}
.empty{padding:14px;color:var(--muted)}
.others{padding:8px 10px;border-top:1px solid var(--line);font-size:13px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:var(--muted)}
.legend{font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px}
@media (max-width:520px){#h-src,td.s{display:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--panel);padding:9px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.zone{fill:rgba(217,138,0,.06);stroke:#d98a00;stroke-dasharray:10 7;cursor:pointer}.zone:hover{fill:rgba(217,138,0,.16)}.ztxt{fill:#8a5600;stroke:#fff;stroke-width:6px;paint-order:stroke;stroke-linejoin:round;font-weight:700;pointer-events:none;font-family:var(--f-body)}
</style>

<div class="wrap">
  <div class="top">
    <span class="brand"><span lang="en">Torque Drill</span> · <span id="brandt">Parça Kataloğu</span></span>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Dil">
        <button id="l-tr" aria-pressed="true">TR</button>
        <button id="l-en" aria-pressed="false">EN</button>
      </div>
      <input type="search" id="q" placeholder="Kod veya parça ara" aria-label="Ara">
      <button class="btn" id="newasm" hidden>+ Montaj</button>
      <button class="btn" id="edit" hidden>Düzenle</button>
    </div>
  </div>
  <nav id="nav" aria-label="Montajlar"></nav>
  <header>
    <h1 id="ttl"></h1>
    <div class="sub" id="subt"></div>
  </header>
  <div class="editbar" id="ebar" hidden>
    <span class="msg" id="emsg"></span>
    <button class="btn" id="addrow">+ Satır</button>
    <button class="btn" id="addbal" disabled>+ Balon</button>
    <button class="btn warn" id="delbal" disabled>Balonu sil</button>
    <button class="btn" id="cancel">Vazgeç</button>
    <button class="btn pri" id="save">Kaydet</button>
  </div>
  <details class="setwrap" id="setw" hidden><summary id="setsum">Montaj ayarları ve görünüşler</summary><section class="settings" id="sets"></section></details>
  <div class="meta" id="meta"></div>

  <div class="grid">
    <section class="sheet" aria-label="Çizim">
      <div class="bar">
        <div class="seg" role="group" id="viewseg"></div>
        <div class="zoom">
          <button id="zo" aria-label="Uzaklaştır">−</button>
          <span class="zl" id="zl">100%</span>
          <button id="zi" aria-label="Yakınlaştır">+</button>
          <button id="zf" aria-label="Sığdır" style="width:auto;padding:0 8px;font-size:12px">⤢</button>
        </div>
      </div>
      <div class="vp" id="vp">
        <div class="canvas" id="cv">
          <img id="img" alt="">
          <svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
        <div class="noview" id="noview" hidden></div>
      </div>
      <div class="detail" id="det"></div>
    </section>

    <section class="list" aria-label="Parça listesi">
      <div class="scroll" id="ls">
        <table>
          <thead><tr><th id="h-del" hidden></th><th id="h-no">No</th><th id="h-code">Katalog No</th><th id="h-name">Parça Adı</th><th id="h-src">Kaynak</th><th id="h-qty" style="text-align:right">Adet</th></tr></thead>
          <tbody id="tb"></tbody>
        </table>
        <div class="empty" id="emp" hidden></div>
      </div>
      <div class="others" id="oth" hidden></div>
      <div class="legend" id="leg"></div>
    </section>
  </div>
</div>

async function pdfToPngs(file){

    const vp=page.getViewport({scale}), c=document.createElement("canvas"); c.width=Math.round(vp.width); c.height=Math.round(vp.height);
    const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:ctx,viewport:vp}).promise;
    out.push({blob:await new Promise(r=>c.toBlob(r,"image/png")), w:c.width, h:c.height, name:`${file.name.replace(/\.pdf$/i,"")} · ${L().page} ${p}`});

}
function imgSize(blob){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(blob), i=new Image(); i.onload=()=>{res({w:i.naturalWidth,h:i.naturalHeight});URL.revokeObjectURL(u);}; i.onerror=rej; i.src=u; }); }
async function uploadViews(files){
  const Lx=L(), a=A(), stat=$("upst"); if(!assets) return;
  for(const f of files){
    try{
      stat.textContent=Lx.uploading;
      let pages=[];
      if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)){ try{ pages=await pdfToPngs(f); }catch(e){ toast(Lx.pdfErr); continue; } }
      else { const s=await imgSize(f); pages=[{blob:f,w:s.w,h:s.h,name:f.name.replace(/\.[^.]+$/,"")}]; }
      for(const pg of pages){
        const r=await assets.upload(pg.blob, pg.blob.type?undefined:{type:"image/png"});
        const n=a.views.length+1;
        a.views.push({id:"v"+Date.now().toString(36)+Math.random().toString(36).slice(2,5), label_tr:`Görünüş ${n}`, label_en:`View ${n}`, asset:r.id, w:pg.w, h:pg.h, mode:"balloon"});
      }
      if(!st.view) st.view=a.views[0].id;
      markDirty();
    }catch(e){ toast(Lx.upErr); }
  }
  stat.textContent=""; st.view=st.view||((a.views[0]||{}).id); full();
}
function enterEdit(){ $("setw").open=false; st.edit=true; st.dirty=false; st.inst=null; st.q=""; $("q").value=""; full(); }
function leaveEdit(revert){
  st.edit=false; st.placing=false; document.body.classList.remove("placing");
  if(revert){
    if(st.isNew){ delete ASM[st.asm]; INDEX=clone(remoteIdx||BASE.index); st.isNew=false; st.dirty=false; const f=entries()[0]; if(f){ openAsm(f.id); return; } }
    INDEX=clone(remoteIdx||INDEX);
    ASM[st.asm]=clone(remote[st.asm]?strip(remote[st.asm]):(BASE.asm[st.asm]||ASM[st.asm]));
    if(!A().views.some(v=>v.id===st.view)) st.view=(A().views[0]||{}).id||null;
  }
  st.dirty=false; st.isNew=false;
}
function strip(r){ const {updatedAt,updatedBy,...rest}=r; return rest; }
async function save(){
  const Lx=L(); $("save").disabled=true;
  try{
    const uid=user?await user.id():null;
    await db.doc("assemblies/"+st.asm).set({...clone(A()), updatedAt:new Date().toISOString(), updatedBy:uid});
    await db.doc("catalog/index").set(clone(INDEX));
    leaveEdit(false); toast(Lx.saved); full();
  }catch(e){ toast(Lx.saveErr); $("save").disabled=false; }
}
async function deleteAsm(){
  if(!confirmTap("asm"+st.asm)) return;
  try{
    const id=st.asm; INDEX.assemblies=INDEX.assemblies.filter(x=>x.id!==id);
    await db.doc("catalog/index").set(clone(INDEX)); await db.doc("assemblies/"+id).delete();
    delete ASM[id]; st.edit=false; st.dirty=false; const f=entries()[0]; if(f) openAsm(f.id); else full();
  }catch(e){ toast(L().saveErr); }
}
function openSettings(){ $("setw").open=true; }
function newAsm(){
  if(st.edit && st.dirty){ toast(L().dirty); return; }
  const id="asm-"+Date.now().toString(36), cur=INDEX.assemblies.find(x=>x.id===st.asm)||{};
  INDEX.assemblies.push({id, title_tr:T.tr.newTitle, title_en:T.en.newTitle, group_tr:cur.group_tr||"", group_en:cur.group_en||"", order:entries().reduce((m,e)=>Math.max(m,e.order||0),0)+1});
  ASM[id]={id,code:"",note_tr:"",note_en:"",views:[],items:[],balloons:{}};
  st.asm=id; st.view=null; st.sel=null; st.inst=null; st.edit=true; st.isNew=true; st.dirty=true; full(); openSettings();
}
$("edit").onclick=enterEdit;
$("newasm").onclick=newAsm;
$("cancel").onclick=()=>{ leaveEdit(true); full(); };
$("save").onclick=save;
$("addrow").onclick=()=>{ const a=A(), no=a.items.reduce((m,x)=>Math.max(m,x.no),0)+1;
  a.items.push({no,code:"",tr:T.tr.newRow,en:T.en.newRow,src:"TD",qty:1}); st.sel=no; markDirty(); full();
  const r=$("tb").querySelector(`tr[data-no="${no}"]`); if(r) r.scrollIntoView({block:"nearest"}); };
$("addbal").onclick=()=>{ if(st.sel==null||!V()) return; st.placing=true; document.body.classList.add("placing"); syncEdit(); };
$("delbal").onclick=()=>{ const v=V(); if(st.inst==null||!v) return; A().balloons[v.id].splice(st.inst,1); st.inst=null; markDirty(); full(); };

/* ---------- misc ---------- */
function full(){ if(!ASM[st.asm]){ const f=entries()[0]; if(f) st.asm=f.id; }
  if(!A().views.some(v=>v.id===st.view)) st.view=(A().views[0]||{}).id||null;
  renderNav(); renderHead(); renderViews(); setImg(); drawOverlay(); renderTable(); renderDetail(); renderSettings(); syncEdit(); }
$("l-tr").onclick=()=>{st.lang="tr";try{localStorage.setItem("td-cat-lang","tr")}catch(e){};full();};
$("l-en").onclick=()=>{st.lang="en";try{localStorage.setItem("td-cat-lang","en")}catch(e){};full();};
$("zi").onclick=()=>setZoom(st.zoom*1.5); $("zo").onclick=()=>setZoom(st.zoom/1.5); $("zf").onclick=()=>setZoom(1);
$("q").addEventListener("input",e=>{st.q=e.target.value; renderNav(); renderTable();});
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(h&&ASM[h]&&h!==st.asm) openAsm(h); });
{ const h=location.hash.slice(1); if(h&&ASM[h]) st.asm=h; }
full();

/* ---------- live data ---------- */
function watchAsm(id){
  if(unsubs[id]||!db) return;
  unsubs[id]=db.doc("assemblies/"+id).onSnapshot(s=>{
    if(!s.exists) return;
    const r=s.data(); remote[id]=r;
    if(st.edit && st.asm===id && st.dirty) return;
    ASM[id]=clone(strip(r));
    if(st.asm===id){ if(st.sel!=null && !A().items.some(x=>x.no===st.sel)) st.sel=null; full(); } else { renderNav(); }
  },()=>{});
}
(async()=>{
  if(!window.claude?.use) return;
  [db,user,assets]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("assets")]);
  isAdmin = user ? await user.canEdit() : false;
  if(db){
    db.doc("catalog/index").onSnapshot(s=>{
      if(!s.exists){ INDEX.assemblies.forEach(e=>watchAsm(e.id)); return; }
      remoteIdx=clone(s.data());
      if(!(st.edit&&st.dirty)) INDEX=clone(remoteIdx);
      INDEX.assemblies.forEach(e=>{ if(!ASM[e.id]) ASM[e.id]={id:e.id,code:"",views:[],items:[],balloons:{}}; watchAsm(e.id); });
      const h=location.hash.slice(1); if(h&&ASM[h]&&h!==st.asm&&!st.edit) st.asm=h;
      if(!st.edit) full(); else renderNav();
    },()=>{});
  }
  syncEdit();
})();
</script>
